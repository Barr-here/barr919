<!DOCTYPE html>
<html lang="id">
<head>
  <script src="js/theme.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Barr Store</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 20px; padding-bottom: 100px; max-width: 900px; margin: 0 auto; }
  .admin-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow2); }
  .admin-title { font-family: var(--mono); font-weight: 700; font-size: 18px; margin-bottom: 14px; color: var(--text); }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .admin-tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font-family: var(--mono); font-size: 13px; }
  .admin-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .admin-panel { display: none; }
  .admin-panel.active { display: block; }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--text); font-family: var(--mono); }
  .form-row input, .form-row textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--mono); font-size: 13px; box-sizing: border-box;
    background: var(--surface2); color: var(--text);
  }
  .form-row input:focus, .form-row textarea:focus { outline: none; border-color: var(--accent); }
  .form-row textarea { min-height: 90px; resize: vertical; }

  .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: var(--mono); font-weight: 600; font-size: 13px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: #e57373; color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; gap: 10px; background: var(--surface2); }
  .item-row .item-title { font-weight: 600; font-size: 14px; color: var(--text); }
  .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .item-actions .btn { padding: 7px 12px; font-size: 12px; }

  #loginBox { max-width: 380px; margin: 60px auto; }
  .hidden { display: none !important; }

  #p_list, #b_list, #t_list { color: var(--subtext); font-family: var(--mono); font-size: 13px; }

  /* Styling popup SweetAlert2 agar sesuai tema website */
  .themed-swal {
    font-family: 'JetBrains Mono', monospace !important;
    border-radius: 14px !important;
  }
  .themed-swal-btn {
    font-family: 'JetBrains Mono', monospace !important;
    font-weight: 600 !important;
    border-radius: 8px !important;
  }
</style>
</head>
<body data-page="auth">

  <div id="loadingBox" class="admin-box" style="text-align:center; font-family: var(--mono); color: var(--subtext); margin-top: 60px;">
    Memeriksa akses admin...
  </div>

  <div id="adminApp" class="hidden">
    <div class="admin-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div class="admin-title" style="margin-bottom:0;">Admin Panel</div>
        <button class="btn btn-secondary" id="logoutBtn" style="width:auto;">Logout</button>
      </div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="products">Produk</button>
        <button class="admin-tab" data-tab="banners">Banner</button>
        <button class="admin-tab" data-tab="testimonials">Testimoni</button>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="admin-panel active" id="panel-products">
      <div class="admin-box">
        <div class="admin-title">Tambah Produk Baru</div>
        <div class="form-row"><label>Tipe</label><input id="p_type" value="PRODUK"></div>
        <div class="form-row"><label>Judul</label><input id="p_title" placeholder="cth: Canva Premium"></div>
        <div class="form-row"><label>Deskripsi singkat</label><input id="p_desc" placeholder="Klik untuk menampilkan price list"></div>
        <div class="form-row"><label>Link WhatsApp</label><input id="p_wa" placeholder="https://wa.me/..."></div>
        <div class="form-row"><label>Link Telegram</label><input id="p_tele" placeholder="https://t.me/..."></div>
        <div class="form-row"><label>Isi lengkap (price list dll)</label><textarea id="p_content"></textarea></div>
        <div class="form-row"><label>Urutan (angka kecil = tampil duluan)</label><input id="p_sort" type="number" value="0"></div>
        <button class="btn btn-primary" id="p_add">+ Tambah Produk</button>
      </div>
      <div class="admin-box">
        <div class="admin-title">Daftar Produk</div>
        <div id="p_list">Memuat...</div>
      </div>
    </div>

    <!-- BANNERS -->
    <div class="admin-panel" id="panel-banners">
      <div class="admin-box">
        <div class="admin-title">Tambah Banner Baru</div>
        <div class="form-row"><label>URL Gambar</label><input id="b_image" placeholder="https://..."></div>
        <div class="form-row"><label>Judul</label><input id="b_title"></div>
        <div class="form-row"><label>Deskripsi (boleh pakai &lt;br&gt;)</label><textarea id="b_desc"></textarea></div>
        <div class="form-row"><label>Link WhatsApp</label><input id="b_wa"></div>
        <div class="form-row"><label>Link Telegram</label><input id="b_tele"></div>
        <div class="form-row"><label>Urutan</label><input id="b_sort" type="number" value="0"></div>
        <button class="btn btn-primary" id="b_add">+ Tambah Banner</button>
      </div>
      <div class="admin-box">
        <div class="admin-title">Daftar Banner</div>
        <div id="b_list">Memuat...</div>
      </div>
    </div>

    <!-- TESTIMONIALS -->
    <div class="admin-panel" id="panel-testimonials">
      <div class="admin-box">
        <div class="admin-title">Tambah Testimoni Baru</div>
        <div class="form-row"><label>URL Gambar</label><input id="t_image" placeholder="https://..."></div>
        <div class="form-row"><label>Tanggal</label><input id="t_date" placeholder="cth: 09 Agustus 2026"></div>
        <div class="form-row"><label>Judul</label><input id="t_title" placeholder="cth: AM Premium"></div>
        <div class="form-row"><label>Deskripsi</label><input id="t_desc" value="Terimkasih atas kepercayaan anda🌹"></div>
        <div class="form-row">
          <label>Urutan</label>
          <input id="t_sort" type="number" placeholder="cht: 100">
          <div id="t_sort_hint" style="font-family: var(--mono); font-size: 11px; color: var(--subtext); margin-top: 4px;"></div>
        </div>
        <button class="btn btn-primary" id="t_add">+ Tambah Testimoni</button>
      </div>
      <div class="admin-box">
        <div class="admin-title">Daftar Testimoni</div>
        <div id="t_list">Memuat...</div>
      </div>
    </div>
  </div>

  <!-- DOCK BAR (pill navbar dengan sliding indicator) -->
  <nav class="dock-bar" id="dockBar">
    <div class="dock-indicator" id="dockIndicator"></div>

    <a href="index.html" class="dock-item" id="dockHome" data-page="beranda">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7"></path>
          <path d="M9 22V12h6v10"></path>
          <path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"></path>
        </svg>
      </div>
      <span class="dock-label">Beranda</span>
    </a>

    <a href="profile.html" class="dock-item" id="dockAuth" data-page="auth">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <span class="dock-label">Profil</span>
    </a>

    <div class="dock-item" id="dockBantuan" data-page="bantuan">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <span class="dock-label">Bantuan</span>
    </div>
  </nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-helper.js"></script>
<script src="js/admin.js"></script>
<script src="js/dock.js"></script>
</body>
</html>
