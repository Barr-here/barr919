<!DOCTYPE html>
<html lang="id">
<head>
  <script src="js/theme.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kasir — Barr Store</title>
<link rel="icon" type="image/png" href="media/icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 20px; padding-bottom: 100px; max-width: 460px; margin: 0 auto; }

  .kasir-box { background: var(--surface); border: var(--bw) solid var(--border); border-radius: var(--radius); padding: 22px; margin: 60px auto 20px; box-shadow: var(--shadow); }

  .kasir-title { font-family: var(--mono); font-weight: 700; font-size: 16px; color: var(--text); margin-bottom: 16px; text-align: center; }

  .kasir-product-name { font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--text); margin-bottom: 4px; }
  .kasir-product-price { font-family: var(--mono); font-size: 13px; color: var(--subtext); margin-bottom: 14px; }

  .kasir-stock-badges { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .kasir-stock-badge {
    display: inline-flex; align-items: center; padding: 7px 11px;
    border: var(--bw) solid var(--border); box-shadow: var(--shadow-sm);
    color: #000; font-family: var(--mono); font-size: 12px; font-weight: 800;
    line-height: 1; letter-spacing: .03em; text-transform: uppercase; border-radius: var(--radius);
  }
  .kasir-stock-available { background: var(--accent); }
  .kasir-stock-sold { background: var(--accent2); }

  .form-row { margin-bottom: 14px; text-align: left; }
  .form-row label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--text); font-family: var(--mono); }
  .form-row input {
    width: 100%; padding: 10px 12px; border: var(--bw) solid var(--border); border-radius: var(--radius);
    font-family: var(--mono); font-size: 14px; box-sizing: border-box; background: var(--surface2); color: var(--text);
  }
  .form-row input:focus { outline: none; border-color: var(--accent); }

  .kasir-total-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border: var(--bw) solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 16px;
  }
  .kasir-total-label { font-family: var(--mono); font-size: 12px; color: var(--subtext); }
  .kasir-total-value { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent2); }

  .btn { padding: 12px 18px; border-radius: var(--radius); border: 2.5px solid var(--border); cursor: pointer; font-family: var(--mono); font-weight: 700; font-size: 13px; width: 100%; margin-top: 8px; box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s; }
  .btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 0 var(--border); }
  .btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 0 var(--border); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-danger { background: #e57373; color: #fff; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: var(--shadow-sm); }

  .kasir-error { color: #d33; font-size: 12px; font-family: var(--mono); margin-top: 4px; margin-bottom: 4px; min-height: 14px; }

  .loading-text { font-family: var(--mono); font-size: 13px; color: var(--subtext); text-align: center; margin-top: 80px; }

  .kasir-footer-note { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--subtext); margin-top: 10px; }
</style>
</head>
<body data-page="beranda">

  <div id="loadingBox" class="loading-text">Memuat kasir...</div>

  <div class="kasir-box" id="kasirBox" style="display:none;">
    <div class="kasir-title">🧾 Kasir</div>

    <div class="kasir-product-name" id="kasirProductName">-</div>
    <div class="kasir-product-price" id="kasirProductPrice">-</div>

    <div class="kasir-stock-badges">
      <span class="kasir-stock-badge kasir-stock-available" id="kasirStockBadge">Memuat stok...</span>
      <span class="kasir-stock-badge kasir-stock-sold" id="kasirSoldBadge">Memuat...</span>
    </div>

    <div class="form-row">
      <label>Jumlah</label>
      <input type="number" id="kasirQtyInput" value="1" min="1">
    </div>

    <div class="kasir-total-row">
      <div class="kasir-total-label">Total Bayar</div>
      <div class="kasir-total-value" id="kasirTotalText">0 coin</div>
    </div>

    <div class="kasir-error" id="kasirError"></div>

    <button class="btn btn-primary" id="kasirSubmitBtn">Bayar Sekarang</button>
    <button class="btn btn-danger" id="kasirCancelBtn">Batal</button>

    <div class="kasir-footer-note">Data akun akan otomatis dikirim ke email kamu setelah pembayaran berhasil</div>
  </div>

  <div class="kasir-box" id="kasirErrorBox" style="display:none; text-align:center;">
    <div class="kasir-title">Produk Tidak Ditemukan</div>
    <div class="kasir-footer-note" style="margin-top:0;">Produk yang kamu cari mungkin sudah dihapus atau link tidak valid.</div>
    <button class="btn btn-primary" onclick="window.location.href='index.html'" style="margin-top:16px;">Kembali ke Beranda</button>
  </div>

  <nav class="dock-bar" id="dockBar">
    <div class="dock-indicator" id="dockIndicator"></div>

    <a href="index.html" class="dock-item" id="dockHome" data-page="beranda">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7"></path>
          <path d="M9 22V12h6v10"></path>
          <path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"></path>
        </svg>
      </div>
      <span class="dock-label">Beranda</span>
    </a>

    <div class="dock-item" id="dockProfil" data-page="auth">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <span class="dock-label">Profil</span>
    </div>

    <a href="help.html" class="dock-item" id="dockBantuan" data-page="bantuan">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <span class="dock-label">Bantuan</span>
    </a>
  </nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth-helper.js"></script>
<script>
  const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const swalTheme = {
    background: isDark ? '#0f1923' : '#ffffff',
    color: isDark ? '#e8f4fb' : '#0d1b2a',
    confirmButtonColor: isDark ? '#00ccff' : '#00aadd',
  };

  const formatCount = (value) => {
    const count = Number(value);
    return Number.isFinite(count) ? count.toLocaleString('id-ID') : '-';
  };

  document.getElementById('dockProfil').addEventListener('click', () => {
    window.location.href = 'profile.html';
  });

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('product');

    if (!productId) {
      showNotFound();
      return;
    }

    const { data: product, error } = await supabaseClient
      .from('products')
      .select('id, title, price')
      .eq('id', productId)
      .maybeSingle();

    if (error || !product || !product.price || product.price <= 0) {
      showNotFound();
      return;
    }

    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('kasirBox').style.display = 'block';

    document.getElementById('kasirProductName').textContent = product.title;
    document.getElementById('kasirProductPrice').textContent = `${product.price} coin / pcs`;
    updateTotal(product.price);

    // Ambil info stok dari Edge Function (data akun tidak boleh diakses langsung dari frontend)
    fetch(SUPABASE_URL + '/functions/v1/purchase', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ action: 'stock-info', productId: product.id }),
    })
      .then((res) => res.json())
      .then((data) => {
        const stockBadge = document.getElementById('kasirStockBadge');
        const soldBadge = document.getElementById('kasirSoldBadge');
        if (data.error) {
          stockBadge.textContent = '- stok';
          soldBadge.textContent = '- terjual';
          return;
        }
        stockBadge.textContent = `${formatCount(data.stock)} stok`;
        soldBadge.textContent = `${formatCount(data.sold)} terjual`;
      })
      .catch(() => {
        document.getElementById('kasirStockBadge').textContent = '- stok';
        document.getElementById('kasirSoldBadge').textContent = '- terjual';
      });

    const qtyInput = document.getElementById('kasirQtyInput');

    qtyInput.addEventListener('input', () => updateTotal(product.price));

    function updateTotal(price) {
      const qty = Math.max(1, parseInt(qtyInput.value) || 1);
      document.getElementById('kasirTotalText').textContent = `${price * qty} coin`;
    }

    document.getElementById('kasirCancelBtn').onclick = () => {
      window.location.href = 'index.html';
    };

    document.getElementById('kasirSubmitBtn').onclick = async () => {
      const btn = document.getElementById('kasirSubmitBtn');
      const errBox = document.getElementById('kasirError');
      errBox.textContent = '';

      const qty = Math.max(1, parseInt(qtyInput.value) || 1);

      const session = await verifySession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/purchase', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({
            action: 'create-order',
            userId: session.userId,
            sessionToken: session.sessionToken,
            productId: product.id,
            quantity: qty,
          }),
        });
        const data = await res.json();

        btn.disabled = false;
        btn.textContent = 'Bayar Sekarang';

        if (!res.ok) {
          errBox.textContent = data.error || 'Gagal memproses pembelian';
          return;
        }

        Swal.fire({
          icon: 'success',
          title: 'Pesanan Berhasil Dibuat',
          html: `<b>${product.title} x${qty}</b><br>Data akun sudah dikirim ke email kamu<br><br>Kalau email belum muncul di kotak masuk, coba cek bagian <b>Spam</b> juga ya`,
          ...swalTheme,
        }).then(() => {
          window.location.href = 'index.html';
        });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Bayar Sekarang';
        errBox.textContent = 'Gagal terhubung ke server';
      }
    };
  })();

  function showNotFound() {
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('kasirErrorBox').style.display = 'block';
  }
</script>
<script src="js/dock.js"></script>
</body>
</html>
