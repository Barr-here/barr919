<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Barr Store</title>
<link rel="icon" type="image/png" href="media/icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 20px; max-width: 460px; margin: 0 auto; }
  .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin: 60px auto 20px; box-shadow: var(--shadow); }
  .auth-title { font-family: var(--mono); font-weight: 700; font-size: 19px; margin-bottom: 4px; color: var(--text); text-align: center; }
  .auth-sub { font-family: var(--mono); font-size: 12px; color: var(--text); opacity: 0.65; text-align: center; margin-bottom: 22px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--surface2); border-radius: 10px; padding: 4px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; cursor: pointer; font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text); opacity: 0.55; transition: 0.2s; }
  .auth-tab.active { background: var(--accent); color: #fff; opacity: 1; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text); font-family: var(--mono); }
  .form-row input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: var(--mono); font-size: 13px; box-sizing: border-box; background: var(--surface2); color: var(--text); }
  .form-row input:focus { outline: none; border-color: var(--accent); }
  .btn { padding: 11px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: var(--mono); font-weight: 600; font-size: 13px; width: 100%; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-link { background: none; border: none; color: var(--accent); font-family: var(--mono); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 14px; display: block; text-align: center; width: 100%; }
  .auth-error { color: #d33; font-size: 12px; margin-top: 10px; font-family: var(--mono); min-height: 14px; }
  .auth-panel { display: none; }
  .auth-panel.active { display: block; }
  .otp-info { font-size: 12px; font-family: var(--mono); color: var(--text); opacity: 0.75; margin-bottom: 16px; line-height: 1.6; text-align: center; }
</style>
</head>
<body>

  <div class="auth-box">
    <div class="auth-title">🔐 Barr Store</div>
    <div class="auth-sub">Login atau daftar akun buat pantau transaksimu</div>

    <!-- TABS -->
    <div class="auth-tabs" id="authTabs">
      <div class="auth-tab active" data-mode="login">Login</div>
      <div class="auth-tab" data-mode="register">Register</div>
    </div>

    <!-- LOGIN PANEL -->
    <div class="auth-panel active" id="panel-login">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email kamu">
      </div>
      <div class="form-row">
        <label>Sandi</label>
        <input type="password" id="loginPassword" placeholder="sandi">
      </div>
      <button class="btn btn-primary" id="loginBtn">Login</button>
      <div class="auth-error" id="loginError"></div>
    </div>

    <!-- REGISTER PANEL -->
    <div class="auth-panel" id="panel-register">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email kamu">
      </div>
      <div class="form-row">
        <label>Sandi</label>
        <input type="password" id="regPassword" placeholder="minimal 6 karakter">
      </div>
      <button class="btn btn-primary" id="regBtn">Daftar</button>
      <div class="auth-error" id="regError"></div>
    </div>

    <!-- OTP VERIFY PANEL -->
    <div class="auth-panel" id="panel-otp">
      <div class="otp-info" id="otpInfo">Kode verifikasi sudah dikirim ke emailmu. Masukkan kodenya di bawah ini.</div>
      <div class="form-row">
        <label>Kode Verifikasi</label>
        <input type="text" id="otpCode" placeholder="masukkan kode dari email" inputmode="numeric">
      </div>
      <button class="btn btn-primary" id="otpBtn">Verifikasi</button>
      <button class="btn-link" id="otpResend">Kirim ulang kode</button>
      <div class="auth-error" id="otpError"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
