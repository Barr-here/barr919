<!DOCTYPE html>
<html lang="id">
<head>
  <script src="js/theme.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Barr Store</title>
<link rel="icon" type="image/png" href="media/icon.png">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 20px; max-width: 460px; margin: 0 auto; }
  .auth-box {
    position: relative;
    background: var(--surface);
    border: var(--bw) solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin: 60px auto 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .auth-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 200px;
    background-image: url('media/login.jpg');
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .auth-box::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0%,
      var(--surface) 100%
    );
    z-index: 1;
  }
  .auth-box > * {
    position: relative;
    z-index: 2;
  }
  .auth-title { font-family: var(--mono); font-weight: 700; font-size: 19px; margin-bottom: 4px; color: var(--text); text-align: center; padding-top: 90px; }
  .auth-sub { font-family: var(--mono); font-size: 12px; color: var(--text); opacity: 0.75; text-align: center; margin-bottom: 22px; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--surface2); border: 2.5px solid var(--border); border-radius: var(--radius); padding: 4px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px 0; border-radius: var(--radius); cursor: pointer; font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text); opacity: 0.6; transition: 0.15s; }
  .auth-tab.active { background: var(--accent); color: #000; opacity: 1; box-shadow: var(--shadow-sm); }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: var(--text); font-family: var(--mono); }
  .form-row input { width: 100%; padding: 10px 12px; border: 2.5px solid var(--border); border-radius: var(--radius); font-family: var(--mono); font-size: 13px; box-sizing: border-box; background: var(--surface2); color: var(--text); transition: 0.15s; box-shadow: var(--shadow-sm); }
  .form-row input:focus { outline: none; transform: translate(2px,2px); box-shadow: 0 0 0 0 var(--border); }
  .password-wrapper input:focus { transform: none; }

  .password-wrapper { position: relative; transition: transform 0.15s; }
  .password-wrapper input { padding-right: 40px; }
  .password-wrapper:focus-within { transform: translate(2px,2px); }
  .password-wrapper:focus-within input { box-shadow: 0 0 0 0 var(--border); }
  .toggle-password {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle-password .eye-icon { width: 18px; height: 18px; }
  .toggle-password:hover { color: var(--accent2); }
  .btn { padding: 11px 18px; border-radius: var(--radius); border: 2.5px solid var(--border); cursor: pointer; font-family: var(--mono); font-weight: 700; font-size: 13px; width: 100%; box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s; }
  .btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 0 var(--border); }
  .btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 0 var(--border); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-link { background: none; border: none; color: var(--accent2); font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 14px; display: block; text-align: center; width: 100%; }
  .auth-error { color: var(--accent); font-size: 12px; font-weight: 700; margin-top: 10px; font-family: var(--mono); min-height: 14px; }
  .auth-panel { display: none; }
  .auth-panel.active { display: block; }
  .otp-info { font-size: 12px; font-family: var(--mono); color: var(--text); opacity: 0.8; margin-bottom: 16px; line-height: 1.6; text-align: center; }
</style>
</head>
<body data-page="auth">

  <div class="auth-box">
    <div class="auth-title">BARR STORE</div>
    <div class="auth-sub">Silahkan login/register terlebih dahulu yah</div>

    <!-- TABS -->
    <div class="auth-tabs" id="authTabs">
      <div class="auth-tab active" data-mode="login">Login</div>
      <div class="auth-tab" data-mode="register">Register</div>
    </div>

    <!-- LOGIN PANEL -->
    <div class="auth-panel active" id="panel-login">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="email kamu">
      </div>
      <div class="form-row">
        <label>Sandi</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="sandi">
          <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Tampilkan sandi">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="loginBtn">Login</button>
      <div class="auth-error" id="loginError"></div>
    </div>

    <!-- REGISTER PANEL -->
    <div class="auth-panel" id="panel-register">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="email kamu">
      </div>
      <div class="form-row">
        <label>Sandi</label>
        <div class="password-wrapper">
          <input type="password" id="regPassword" placeholder="minimal 6 karakter">
          <button type="button" class="toggle-password" data-target="regPassword" aria-label="Tampilkan sandi">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn btn-primary" id="regBtn">Daftar</button>
      <div class="auth-error" id="regError"></div>
    </div>

    <!-- OTP VERIFY PANEL -->
    <div class="auth-panel" id="panel-otp">
      <div class="otp-info" id="otpInfo">Kode verifikasi sudah dikirim ke emailmu<br>Masukkan kode yang diberikan dibawah ini</div>
      <div class="form-row">
        <label>Kode Verifikasi</label>
        <input type="text" id="otpCode" placeholder="kode..." inputmode="numeric">
      </div>
      <button class="btn btn-primary" id="otpBtn">Verifikasi</button>
      <button class="btn-link" id="otpResend">Kirim ulang kode</button>
      <div class="auth-error" id="otpError"></div>
    </div>
  </div>

  <nav class="dock-bar" id="dockBar">
    <div class="dock-indicator" id="dockIndicator"></div>

    <a href="index.html" class="dock-item" id="dockHome" data-page="beranda">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7"></path>
          <path d="M9 22V12h6v10"></path>
          <path d="M5 10v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10"></path>
        </svg>
      </div>
      <span class="dock-label">Beranda</span>
    </a>

    <div class="dock-item" id="dockAuthCurrent" data-page="auth">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
      </div>
      <span class="dock-label">Login</span>
    </div>

    <div class="dock-item" id="dockBantuan" data-page="bantuan">
      <div class="dock-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <span class="dock-label">Bantuan</span>
    </div>
  </nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/login.js"></script>
<script>
  // ----- TOGGLE SHOW/HIDE PASSWORD -----
  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';

      btn.innerHTML = isHidden
        ? `<svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94"></path>
             <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.5"></path>
             <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
             <line x1="1" y1="1" x2="23" y2="23"></line>
           </svg>`
        : `<svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
             <circle cx="12" cy="12" r="3"></circle>
           </svg>`;
    });
  });
</script>
<script src="js/dock.js"></script>
</body>
</html>
